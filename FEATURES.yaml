# Ollie Feature Registry
#
# This file tracks all user-facing features for:
# - Release planning (what to ship)
# - Testing coverage (what to test)
# - Tier decisions (free vs premium)
# - Documentation needs
#
# Status: planned | in-progress | shipped | deprecated
# Tier: free | premium | beta
# Platforms: ios | widget | watch

meta:
  version: 2.0.0
  last_updated: 2026-03-06
  pricing_model: premium_ai  # trial-to-paid, no free tier
  pricing:
    monthly: 5.99  # EUR
    yearly: 49.99  # EUR (30% discount)
    trial_days: 14
    currency: EUR
  ai_costs:
    estimated_per_user_monthly: 1.50  # EUR
    provider: anthropic
    model: claude-haiku-4.5
  trial_access:  # What trial users get (everything)
    profiles: 5
    training_skills: unlimited
    sharing_partners: unlimited
    ai_features: full
  subscriber_access:  # Same as trial
    profiles: 5
    training_skills: unlimited
    sharing_partners: unlimited
    ai_features: full

