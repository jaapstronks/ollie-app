# Ollie Feature Registry
#
# This file tracks all user-facing features for:
# - Release planning (what to ship)
# - Testing coverage (what to test)
# - Tier decisions (free vs premium)
# - Documentation needs
#
# Status: planned | in-progress | shipped | deprecated
# Tier: free | premium | beta
# Platforms: ios | widget | watch
#
# Feature files are split by domain in features/*.yaml

meta:
  version: 2.0.0
  last_updated: 2026-03-07
  pricing_model: premium_ai  # trial-to-paid, no free tier
  pricing:
    monthly: 5.99  # EUR
    yearly: 49.99  # EUR (30% discount)
    trial_days: 14
    currency: EUR
  ai_costs:
    estimated_per_user_monthly: 1.50  # EUR
    provider: anthropic
    model: claude-haiku-4.5
  trial_access:  # What trial users get (everything)
    profiles: 5
    training_skills: unlimited
    sharing_partners: unlimited
    ai_features: full
  subscriber_access:  # Same as trial
    profiles: 5
    training_skills: unlimited
    sharing_partners: unlimited
    ai_features: full

# Feature domains (split into separate files for maintainability)
# Each file follows the same schema with id, name, description, tier, status, etc.
feature_files:
  - features/core.yaml           # Onboarding, daily logging, timeline
  - features/health-training.yaml # Health, training, socialization
  - features/organization.yaml    # Calendar, places, moments, walks
  - features/system.yaml          # Notifications, data, sharing, settings
  - features/ai-smart.yaml        # AI features, smart features, insights
