health:

  - id: potty-status
    name: Potty Training Status
    description: Track potty count, urgency indicators, and gap analysis
    tier: free
    status: shipped
    platforms: [ios]
    entry_points: [today-tab, health-tab]
    key_files:
      - Views/Cards/PottyStatusCard.swift
      - Views/Cards/PoopStatusCard.swift
      - Calculations/Poop/PoopCalculations.swift
