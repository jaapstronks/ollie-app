    docs: false

  - id: potty-predictions
    name: Potty Predictions
    description: AI-powered prediction of next potty need based on patterns
    tier: premium
    premium_feature: pottyPredictions
    status: shipped
    platforms: [ios]
    entry_points: [today-tab]
    key_files:
      - Calculations/PredictionCalculations.swift
      - ViewModels/TimelineViewModel+Predictions.swift
