    tested: false
    docs: false

  - id: sleep-status
    name: Sleep Status
    description: Basic sleep duration tracking and nap vs overnight distinction
    tier: free
    status: shipped
    platforms: [ios]
    entry_points: [today-tab]
    key_files:
      - Views/Cards/SleepStatusCard.swift
    tested: false
    docs: false

  - id: sleep-insights
    name: Sleep Insights
    description: Advanced sleep pattern analysis and recommendations
    tier: premium
    premium_feature: sleepInsights
    status: shipped
    platforms: [ios]
    entry_points: [health-tab]
    key_files:
      - Calculations/SleepCalculations.swift
    depends_on: [sleep-status]
    tested: false
    docs: false

  - id: streaks
    name: Outdoor Potty Streaks
    description: Track consecutive outdoor potty successes
    tier: free
    status: shipped
    platforms: [ios]
    entry_points: [today-tab]
    key_files:
      - Calculations/StreakCalculations+iOS.swift
      - Views/Cards/StreakCard.swift
    tested: false
    docs: false

  - id: growth-tracking
    name: Growth & Weight Charts
    description: Visualize weight trends and growth over time
    tier: premium
    premium_feature: advancedAnalytics
    status: shipped
    platforms: [ios]
    entry_points: [health-tab]
    key_files:
      - Views/Health/WeightChartView.swift
      - Views/Cards/GrowthStoryCard.swift
